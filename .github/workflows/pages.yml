# Builds the site from KiiteShell's docs and publishes it to GitHub Pages.
#
# Runs on every push to main, and whenever KiiteShell's docs change: KiiteShell's
# site-docs workflow then force-pushes a one-commit docs-sync branch here, which starts this.
# It also runs once a day, as a fallback, and on demand.
name: Pages

on:
  push:
    branches: [main, docs-sync]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Always the site's main, even when docs-sync started the run: that branch only
      # carries a marker.
      - uses: actions/checkout@v4
        with:
          ref: main

      # KiiteShell is private, so this needs a read-only deploy key on that repo, with the
      # private half saved here as the KIITESHELL_DEPLOY_KEY secret.
      - name: Check out KiiteShell for its docs
        uses: actions/checkout@v4
        with:
          repository: Kiite-Org/KiiteShell
          ssh-key: ${{ secrets.KIITESHELL_DEPLOY_KEY }}
          path: KiiteShell
          sparse-checkout: |
            README.md
            docs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build
        env:
          KIITE_DIR: KiiteShell
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
