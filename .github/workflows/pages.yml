# Builds the site and deploys it to GitHub Pages. Runs on pushes to main, on pushes to docs-sync
# (KiiteShell pushes it on every push to its main), daily, and on demand.
name: Pages

on:
  push:
    branches: [main, docs-sync]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Build main, even when docs-sync started the run.
      - uses: actions/checkout@v4
        with:
          ref: main

      # KiiteShell is private: read it with a deploy key (secret KIITESHELL_DEPLOY_KEY).
      - name: Check out KiiteShell for its docs
        uses: actions/checkout@v4
        with:
          repository: Kiite-Org/KiiteShell
          ssh-key: ${{ secrets.KIITESHELL_DEPLOY_KEY }}
          path: KiiteShell
          # Full history (without file contents) for the contributors section.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            README.md
            docs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build
        env:
          KIITE_DIR: KiiteShell
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/
          SITE_URL: ${{ steps.pages.outputs.base_url }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
